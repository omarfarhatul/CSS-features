<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ball Animation</title>
    <style>
        .all{
            display: flex;
            gap: 150px;
            margin-left: 80px;
        }

        @keyframes ping-pong{
            from{
                left: 0;
            }
            to{
                left: 500px;
                background-color: red;
            }
        }

        @keyframes bounce{
            0%{
                top: 0px;
                left: 0px;
            }
            25%{
                left: 150px;
                top: 200px;
                background-color: blue;
            }
            50%{
                top: 0px;
                left: 300px;
                background-color: green;
            }
            100%{
                top: 200px;
                left: 500px;
                background-color: red;
            }
        }

        .stage{
            width: 600px;
            height: 300px;
            border: 2px solid steelblue;
            background-color: aqua;
        }

        .ball{
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: yellow;
            position: relative;
            animation: bounce 3s ease-in-out 1s infinite alternate;
        }

        .stage1{
            width: 600px;
            height: 300px;
            border: 2px solid steelblue;
            background-color: aqua;
        }

        .ball1{
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: yellow;
            position: relative;
            animation: ping-pong 2s ease-in-out 1s infinite alternate;
        }
    </style>
</head>
<body>
    <h2>Explore Animation</h2>
    <div class="all">
        <div class="stage">
            <div class="ball"></div>
        </div>

        <div class="stage1">
            <div class="ball1"></div>
        </div>
    </div>
</body>
</html>
